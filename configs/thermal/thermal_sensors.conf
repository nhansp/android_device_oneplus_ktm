# Sensors reported to the framework, and the temperatures at which each
# throttling severity is claimed.
#
#   type  zone  name  LIGHT MODERATE SEVERE CRITICAL EMERGENCY SHUTDOWN
#
# `zone` is matched against /sys/class/thermal/thermal_zone*/type, never an
# index -- indices are not stable across boots. A zone named here that the
# kernel does not expose is logged and skipped.
#
# This HAL only *reports*. thermal-engine owns mitigation on this platform, and
# a second writer driving the same cooling devices would fight it.

# SKIN is the number the framework hands to apps via getThermalHeadroom(), so it
# has to be the chassis temperature a user actually touches. horae fits that
# from the board sensors and publishes it as shell_front. The QTI HAL bound SKIN
# to sys-therm-2 instead -- a raw board sensor that runs ~6C hot at idle and
# ~27C hot under load -- so the phone claimed it was throttling at a 42C
# chassis, and every app honouring the thermal API backed off for no reason.
#
# Thresholds are a conservative first pass, not calibrated: 42C was observed at
# idle-while-charging, so LIGHT sits above that. Tune against real sustained
# load before treating these as final.
skin    shell_front     skin    43      45      47      49      52      57

# QTI's compiled-in sun profile used SEVERE 95 / SHUTDOWN 115 for the CPU
# cluster sensors; the rungs between are interpolated.
cpu     cpuss-0-0       cpu0    85      90      95      105     110     115
cpu     cpuss-0-1       cpu1    85      90      95      105     110     115
